<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="FormPage.css">
    <title>Document</title>
</head>

<body>
    <form action="" method="post">
        <label for="FullName">Your Full name</label>
        <input type="text" id="FullName" name="FullName" placeholder="Enter your full name" required>
        <br>
        <label for="telephone">Your Phone Number</label>
        <input type="tel" id="telephone" name="telephone" placeholder="077 123 4567" required>
        <br>
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" placeholder="######@gmial.com" required>
        <br>
        <label for="message">Your Message</label>
        <textarea id="message" name="message" placeholder="Type your message here"></textarea>
        <br>
        <button type="reset">Submit</button>
    </form>
</body>

</html>
